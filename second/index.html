<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стоматологический лендинг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 100%;
            max-width: 414px;
            background-color: white;
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
        }
        
        .image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .main-image {
            max-width: 100%;
            max-height: calc(100vh - 100px);
            width: auto;
            height: auto;
            object-fit: contain;
        }
        
        .start-btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: background-color 0.3s;
            margin-top: auto;
        }
        
        .start-btn:hover {
            background-color: #3367d6;
        }
        
        @media (min-width: 768px) {
            body {
                padding: 20px 0;
            }
            
            .phone-container {
                min-height: calc(100vh - 40px);
                border-radius: 20px;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="content">
            <div class="image-container">
                <img src="assets/1.jpg" alt="Здоровые зубы" class="main-image" id="mainImage">
            </div>
            <a href="truth-or-myth.html" class="start-btn">Начать</a>
        </div>
    </div>

    <script>
        function adjustImage() {
            const img = document.getElementById('mainImage');
            const container = document.querySelector('.image-container');
            const windowHeight = window.innerHeight;
            const windowWidth = window.innerWidth;
            const buttonHeight = 60; // Примерная высота кнопки с отступами
            
            // Рассчитываем доступную высоту для изображения
            const availableHeight = windowHeight - buttonHeight - 30; // 30px - дополнительные отступы
            
            // Проверяем пропорции изображения и контейнера
            if (img.naturalWidth && img.naturalHeight) {
                const imgRatio = img.naturalWidth / img.naturalHeight;
                const containerRatio = windowWidth / availableHeight;
                
                if (imgRatio > containerRatio) {
                    // Ширина ограничивающий фактор
                    img.style.width = '100%';
                    img.style.height = 'auto';
                } else {
                    // Высота ограничивающий фактор
                    img.style.width = 'auto';
                    img.style.height = availableHeight + 'px';
                }
            } else {
                // Если натуральные размеры неизвестны (изображение ещё не загружено)
                img.onload = adjustImage;
            }
        }

        // Вызываем функцию при загрузке и изменении размера окна
        window.addEventListener('load', adjustImage);
        window.addEventListener('resize', adjustImage);
    </script>
</body>
</html>
