<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваш приз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 100%;
            max-width: 414px;
            background-color: white;
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        
        .prize-image-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .prize-image {
            width: 90%;
            height: auto;
            max-height: calc(100vh - 100px);
            object-fit: contain;
        }
        
        .wb-link {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 16px;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        
        .wb-link:hover {
            background-color: #3367d6;
        }
        
        @media (min-width: 768px) {
            body {
                padding: 20px 0;
            }
            
            .phone-container {
                min-height: calc(100vh - 40px);
                border-radius: 20px;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="prize-image-container">
            <img src="assets/2.jpg" alt="Ваш приз" class="prize-image">
        </div>
        <a href="https://www.wildberries.ru/brands/oral-b/all" class="wb-link" target="_blank">
            Перейти на WB
        </a>
    </div>
</body>
</html>
