<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваш приз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 100%;
            max-width: 414px;
            background-color: white;
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .content {
            padding: 30px;
        }
        
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        
        .prize-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .discount {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
        }
        
        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #4285f4;
            margin-bottom: 30px;
        }
        
        .wb-link {
            display: inline-block;
            padding: 15px 25px;
            background-color: #FF5722;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        
        .wb-link:hover {
            background-color: #E64A19;
        }
        
        @media (min-width: 768px) {
            body {
                padding: 20px 0;
            }
            
            .phone-container {
                min-height: calc(100vh - 40px);
                border-radius: 20px;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="content">
            <h1>Спасибо за участие!</h1>
            <div class="prize-text">
                Вы прослушали все треки нашего стоматологического плейлиста!
            </div>
            <div class="prize-text">
                Ваш приз:
            </div>
            <div class="discount">20%</div>
            <div class="brand">на продукцию Oral-B</div>
            <div class="prize-text">
                на Wildberries
            </div>
            <a href="https://www.wildberries.ru/catalog/0/search.aspx?search=oral-b" class="wb-link" target="_blank">
                Перейти на WB
            </a>
        </div>
    </div>
</body>
</html>
