<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .phone-container {
            width: 100%;
            max-width: 414px;
            background-color: white;
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .content {
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .playlist {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .track {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: background-color 0.3s;
        }
        
        .track:hover {
            background-color: #f0f0f0;
        }
        
        .track-cover {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            object-fit: cover;
        }
        
        .track-info {
            flex-grow: 1;
        }
        
        .track-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .track-artist {
            font-size: 14px;
            color: #666;
        }
        
        .track-duration {
            font-size: 14px;
            color: #999;
        }
        
        .play-button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #4285f4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .play-button.played {
            background-color: #4CAF50;
        }
        
        .playlist-link {
            display: block;
            text-align: center;
            padding: 15px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        .playlist-link:hover {
            background-color: #3367d6;
        }
        
        @media (min-width: 768px) {
            body {
                padding: 20px 0;
            }
            
            .phone-container {
                min-height: calc(100vh - 40px);
                border-radius: 20px;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="content">
            <h1>Стоматологический плейлист</h1>
            
            <div class="playlist">
                <div class="track">
                    <img src="https://via.placeholder.com/50x50/FF5733/FFFFFF?text=Cover1" alt="Обложка" class="track-cover">
                    <div class="track-info">
                        <div class="track-title">Teeth</div>
                        <div class="track-artist">5 Seconds of summer</div>
                    </div>
                    <div class="track-duration">2:05</div>
                    <div class="play-button">▶</div>
                </div>
                
                <div class="track">
                    <img src="https://via.placeholder.com/50x50/33FF57/FFFFFF?text=Cover2" alt="Обложка" class="track-cover">
                    <div class="track-info">
                        <div class="track-title">Абракадабра</div>
                        <div class="track-artist">Lady Gaga</div>
                    </div>
                    <div class="track-duration">2:01</div>
                    <div class="play-button">▶</div>
                </div>
                
                <div class="track">
                    <img src="https://via.placeholder.com/50x50/3357FF/FFFFFF?text=Cover3" alt="Обложка" class="track-cover">
                    <div class="track-info">
                        <div class="track-title">Dentist</div>
                        <div class="track-artist">Hot Fox Karaoke</div>
                    </div>
                    <div class="track-duration">1:49</div>
                    <div class="play-button">▶</div>
                </div>
            </div>
            
            <a href="https://music.yandex.ru" class="playlist-link" target="_blank">
                Открыть в Яндекс.Музыке
            </a>
        </div>
    </div>

    <script>
        const playButtons = document.querySelectorAll('.play-button');
        let playedTracks = 0;
        const totalTracks = 3;
        
        playButtons.forEach(button => {
            button.addEventListener('click', function() {
                if (!this.classList.contains('played')) {
                    const track = this.closest('.track');
                    const title = track.querySelector('.track-title').textContent;
                    
                    // Изменяем кнопку
                    this.textContent = '✓';
                    this.classList.add('played');
                    playedTracks++;
                    
                    // Показываем уведомление
                    alert(`Воспроизводится: ${title}`);
                    
                    // Проверяем, все ли треки проиграны
                    if (playedTracks === totalTracks) {
                        // Переход на страницу с призом через 2 секунды
                        setTimeout(() => {
                            window.location.href = 'prize.html';
                        }, 2000);
                    }
                }
            });
        });
    </script>
</body>
</html>
