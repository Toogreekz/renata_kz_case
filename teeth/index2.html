<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спаси Смайлтаун!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #2954a4;
            overflow-x: hidden;
            /* Добавляем основной скролл для body */
            overflow-y: auto;
        }
        
        #app {
            position: relative;
            width: 100%;
            max-width: 414px;
            min-height: 100vh; /* Изменено с 667px */
            /* Убираем внутренний скролл */
            /* overflow-y: auto; */
            background-color: #2954a4;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            color: white;
        }
        
        #header-image {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
            z-index: 30;
        }
        
        #intro-text {
            position: relative;
            z-index: 30;
            text-align: center;
            padding: 10px 20px;
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        
        #intro-text b {
            font-weight: bold;
            font-style: italic;
        }
        
        #path-container {
            position: relative;
            width: 100%;
            height: calc(100% - 150px);
        }
        
        #path-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        #person {
            position: absolute;
            width: 90px;
            height: 90px;
            transition: all 2s ease-in-out;
            z-index: 10;
            transform: translate(-50%, -50%);
        }
        
        .point {
            position: absolute;
            width: 90px;
            height: 90px;
            z-index: 5;
            transform: translate(-50%, -50%);
        }
        
        #point1 {
            top: 35%;
            left: 20%;
            display: none;
            position: absolute;
        }
        
        #point2 {
            top: 55%;
            left: 75%;
            display: none;
            position: absolute;
        }
        
        #point3 {
            top: 80%;
            left: 25%;
            display: none;
            position: absolute;
        }
        
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 20;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: #2954a4;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            background-color: #264e95;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .modal-body {
            background-color: white;
            padding: 20px;
            border-radius: 0 0 15px 15px;
            color: #333;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: white;
        }
        
        .toothpaste-options {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }
        
        .toothpaste-option {
            width: 30%;
            cursor: pointer;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .toothpaste-option:hover {
            border-color: #2954a4;
        }
        
        .toothpaste-option img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            display: block;
        }
        
        .feedback {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: pre-line;
        }
        
        .correct-mark::after {
            content: "✓";
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: green;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .wrong-mark::after {
            content: "✖";
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: red;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .point-message {
            position: absolute;
            background-color: #264e95;
            color: white;
            padding: 15px;
            border-radius: 10px;
            max-width: 60%;
            text-align: center;
            z-index: 15;
            font-size: 14px;
            line-height: 1.4;
            display: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        #point1-message {
            left: 60%;
            top: 35%;
        }
        
        #point2-message {
            right: 60%;
            top: 55%;
        }
        
        #point3-message {
            left: 60%;
            top: 80%;
        }
    </style>
</head>
<body>
    <div id="app">
        <img id="header-image" src="oralb.png" alt="Oral-B">
        <div id="intro-text">Улыбки жителей Смайлтауна под угрозой! Помоги городу вновь обрести сияние и выиграй призы от <b>Oral-B</b>!</div>
        <div id="path-container">
            <img id="path-image" src="path.png" alt="Путь">
            <img id="person" src="person.png" alt="Человек" style="display: none;">
            <img id="point1" class="point" src="1.png" alt="Точка 1" style="display: none;">
            <img id="point2" class="point" src="2.png" alt="Точка 2" style="display: none;">
            <img id="point3" class="point" src="3.png" alt="Точка 3" style="display: none;">
            
            <div id="point1-message" class="point-message"></div>
            <div id="point2-message" class="point-message"></div>
            <div id="point3-message" class="point-message"></div>
            
            <button id="start-btn">Начать</button>
        </div>
        
        <div id="question-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div class="modal-header" id="modal-header-text"></div>
                <div class="modal-body">
                    <div class="toothpaste-options" id="toothpaste-options">
                        <div class="toothpaste-option" data-option="1">
                            <img src="4.png" alt="Паста 1">
                        </div>
                        <div class="toothpaste-option" data-option="2">
                            <img src="5.png" alt="Паста 2">
                        </div>
                        <div class="toothpaste-option" data-option="3">
                            <img src="6.png" alt="Паста 3">
                        </div>
                    </div>
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        </div>
        
        <div id="success-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div class="modal-header">Поздравляем!</div>
                <div class="modal-body" style="text-align: center;">
                    <p>Вы успешно помогли жителям Смайлтауна!</p>
                    <p>Ваш приз - набор продукции от <b>Oral-B</b>!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Элементы DOM
            const app = document.getElementById('app');
            const headerImage = document.getElementById('header-image');
            const pathImage = document.getElementById('path-image');
            const person = document.getElementById('person');
            const point1 = document.getElementById('point1');
            const point2 = document.getElementById('point2');
            const point3 = document.getElementById('point3');
            const startBtn = document.getElementById('start-btn');
            const questionModal = document.getElementById('question-modal');
            const successModal = document.getElementById('success-modal');
            const modalHeaderText = document.getElementById('modal-header-text');
            const toothpasteOptions = document.getElementById('toothpaste-options');
            const feedback = document.getElementById('feedback');
            const closeBtns = document.querySelectorAll('.close-btn');
            const point1Message = document.getElementById('point1-message');
            const point2Message = document.getElementById('point2-message');
            const point3Message = document.getElementById('point3-message');
            
            // Сообщения для точек
            const pointMessages = [
                "Ольга Николаевна перестала улыбаться из-за чувствительных и склонных к кровоточивости десен. Подбери ей подходящую пасту и верни белоснежную улыбку!",
                "Иван Петрович страдает от неприятного запаха изо рта. Помоги ему выбрать правильную пасту!",
                "Анна Сергеевна хочет, чтобы ее зубы были белее. Выбери для нее подходящую пасту!"
            ];
            
            // Правильные ответы для каждой точки (1, 2 или 3 - соответствует data-option)
            const correctAnswers = [1, 3, 2];
            
            // Заголовки модальных окон для каждой точки
            const modalTitles = [
                "Выбери пасту для Ольги Николаевны!",
                "Выбери пасту для Ивана Петровича!",
                "Выбери пасту для Анны Сергеевны!"
            ];
            
            // Переменные состояния
            let currentPoint = -1;
            let startTime = 0;
            let timerInterval = null;
            let gameStarted = false;
            
            // Инициализация приложения
            function init() {
                // Обработчик кнопки "Начать"
                startBtn.addEventListener('click', startJourney);
                
                // Обработчики закрытия модальных окон
                closeBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        questionModal.style.display = 'none';
                        successModal.style.display = 'none';
                    });
                });
                
                // Обработчик кнопки ESC
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        questionModal.style.display = 'none';
                        successModal.style.display = 'none';
                    }
                });
                
                // Обработчики выбора пасты
                document.querySelectorAll('.toothpaste-option').forEach(option => {
                    option.addEventListener('click', function() {
                        checkAnswer(parseInt(this.dataset.option));
                    });
                });
                
                // Обработчик клика по персонажу для повторного открытия модального окна
                person.addEventListener('click', function() {
                    if (gameStarted && currentPoint >= 0 && currentPoint < 3) {
                        showQuestion(currentPoint);
                    }
                });
                
                // Начальная позиция персонажа (верх экрана)
                person.style.top = '20%';
                person.style.left = '50%';
            }
            
            // Начать путешествие
            function startJourney() {
                gameStarted = true;
                startBtn.style.display = 'none';
                person.style.display = 'block';
                
                // Показываем точки
                [point1, point2, point3].forEach(point => {
                    point.style.display = 'block';
                    // Принудительный рефлоу для корректного позиционирования
                    void point.offsetHeight;
                });

                // Стартовая позиция персонажа
                person.style.top = '20%';
                person.style.left = '50%';
                
                // Запускаем перемещение к первой точке через небольшую задержку
                setTimeout(() => moveToPoint(0), 100);
            }
            
            // Перемещение к точке
            function moveToPoint(pointIndex) {
                currentPoint = pointIndex;
                const targetPoint = document.getElementById(`point${pointIndex+1}`);
                
                // Получаем позиции точки относительно контейнера
                const containerRect = pathContainer.getBoundingClientRect();
                const pointRect = targetPoint.getBoundingClientRect();
                
                // Рассчитываем позиции в процентах
                const top = ((pointRect.top - containerRect.top) / containerRect.height) * 100;
                const left = ((pointRect.left - containerRect.left) / containerRect.width) * 100;
                
                // Применяем анимацию к персонажу
                person.style.transition = 'all 2s ease-in-out';
                person.style.top = `${top}%`;
                person.style.left = `${left}%`;

                // Показываем сообщение для точки
                showPointMessage(pointIndex);
                
                // Через 6 секунд показываем модальное окно с вопросом
                setTimeout(() => {
                    hidePointMessage(pointIndex);
                    showQuestion(pointIndex);
                }, 6000);
            }
            
            // Показать сообщение точки
            function showPointMessage(pointIndex) {
                const messageElement = document.getElementById(`point${pointIndex+1}-message`);
                messageElement.textContent = pointMessages[pointIndex];
                messageElement.style.display = 'block';
            }
            
            // Скрыть сообщение точки
            function hidePointMessage(pointIndex) {
                const messageElement = document.getElementById(`point${pointIndex+1}-message`);
                messageElement.style.display = 'none';
            }
            
            // Перемещение к следующей точке
            function moveToNextPoint() {
                const nextPoint = currentPoint + 1;
                
                if (nextPoint < 3) {
                    moveToPoint(nextPoint);
                } else {
                    // Путешествие завершено
                    journeyCompleted();
                }
            }
            
            // Показать вопрос
            function showQuestion(pointIndex) {
                modalHeaderText.textContent = modalTitles[pointIndex];
                
                // Сбрасываем состояние вариантов ответов
                document.querySelectorAll('.toothpaste-option').forEach(option => {
                    option.classList.remove('correct-mark', 'wrong-mark');
                });
                
                feedback.textContent = '';
                
                questionModal.style.display = 'flex';
            }
            
            // Проверить ответ
            function checkAnswer(selectedOption) {
                const correctOption = correctAnswers[currentPoint];
                const options = document.querySelectorAll('.toothpaste-option');
                
                // Сбрасываем все отметки
                options.forEach(option => {
                    option.classList.remove('correct-mark', 'wrong-mark');
                });
                
                if (selectedOption === correctOption) {
                    // Правильный ответ
                    options[selectedOption-1].classList.add('correct-mark');
                    feedback.textContent = "Верно!";
                    
                    // Закрываем модальное окно через 1.5 секунды
                    setTimeout(() => {
                        questionModal.style.display = 'none';
                        moveToNextPoint();
                    }, 1500);
                } else {
                    // Неправильный ответ
                    options[selectedOption-1].classList.add('wrong-mark');
                    feedback.textContent = "Неверно,\nпопробуй еще!";
                }
            }
            
            // Путешествие завершено
            function journeyCompleted() {
                clearInterval(timerInterval);
                
                // Проверяем время прохождения
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed < 60) {
                    successModal.style.display = 'flex';
                }
            }
            
            // Запускаем приложение
            init();
        });
    </script>
</body>
</html>
